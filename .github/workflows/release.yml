name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for CI workflow on commit $GITHUB_SHA..."
          for i in $(seq 1 60); do
            status=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --json conclusion \
              --jq '.[0].conclusion // empty')

            case "$status" in
              success)
                echo "CI passed"
                exit 0
                ;;
              failure|cancelled|timed_out)
                echo "::error::CI workflow finished with status: $status"
                exit 1
                ;;
            esac

            echo "CI still running... (attempt $i/60)"
            sleep 15
          done
          echo "::error::Timed out waiting for CI workflow"
          exit 1

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish-binaries:
    runs-on: ubuntu-latest
    needs: [wait-for-ci, version]
    strategy:
      matrix:
        include:
          - rid: linux-x64
            artifact: marv-linux-x64
          - rid: linux-arm64
            artifact: marv-linux-arm64
          - rid: osx-x64
            artifact: marv-osx-x64
          - rid: osx-arm64
            artifact: marv-osx-arm64
          - rid: win-x64
            artifact: marv-win-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          VERSION=${{ needs.version.outputs.version }}
          dotnet publish src/Marv/Marv.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.artifact }} -p:Version="$VERSION"
          for plugin in src/plugins/*/; do
            dotnet build "$plugin" -c Release -r ${{ matrix.rid }} -p:Version="$VERSION"
            name=$(basename "$plugin")
            mkdir -p publish/${{ matrix.artifact }}/plugins
            cp "$plugin/bin/Release/net10.0/${{ matrix.rid }}/$name.dll" publish/${{ matrix.artifact }}/plugins/ 2>/dev/null || \
            cp "$plugin/bin/Release/net10.0/$name.dll" publish/${{ matrix.artifact }}/plugins/
          done

      - name: Archive
        run: |
          cd publish
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.artifact }}.tar.gz

  docker:
    runs-on: ubuntu-latest
    needs: [wait-for-ci, version]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-binaries, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: marv-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
